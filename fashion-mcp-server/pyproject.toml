[project]
name = "fashion-mcp-server"
version = "0.1.0"
description = "Fashion-domain MCP server built with FastMCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
fashion-mcp = "fashion_tools:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
