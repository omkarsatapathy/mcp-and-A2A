services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - A2A_HOST=0.0.0.0
      - A2A_PORT=8080
      - A2A_BASE_URL=http://localhost:8080
      - USE_AWS_SECRETS=false
      - USE_BEDROCK_MEMORY=false
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/ping').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
